ignore-dev-dependencies = true
ignore-build-dependencies = false
ignore-transitive-dependencies = false
private = { ignore = true }
# License texts are at crate roots or in one nested license directory.
# Missing actual texts fail verification and require an explicit clarification.
max-depth = 2

