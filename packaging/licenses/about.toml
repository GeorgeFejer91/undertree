# Reviewed licenses selected from the locked Linux desktop dependency graph.
# Keep transitive and build contributions; this is not a blanket license exception.
accepted = ["MIT", "Apache-2.0", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "Apache-2.0 WITH LLVM-exception", "CC0-1.0"]
targets = ["x86_64-unknown-linux-gnu"]
ignore-dev-dependencies = true
ignore-build-dependencies = false
ignore-transitive-dependencies = false
private = { ignore = true }
# License texts are at crate roots or in one nested license directory.
# Missing actual texts fail verification and require an explicit clarification.
max-depth = 2

