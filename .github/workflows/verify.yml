name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install TeX verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            fonts-noto-core \
            fonts-liberation \
            python3-gi \
            gir1.2-gtk-3.0 \
            gir1.2-webkit2-4.1 \
            xvfb \
            xauth \
            dbus-x11 \
            latexmk \
            poppler-utils \
            texlive-fonts-recommended \
            texlive-latex-extra \
            texlive-luatex \
            texlive-pictures
      - name: Install the qualified Typst compiler
        run: |
          # Digest supplied by the official typst/typst v0.15.1 release asset API.
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/typst.tar.xz" https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz
          printf '%s  %s\n' a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c "$RUNNER_TEMP/typst.tar.xz" | sha256sum --check --strict
          tar -xJf "$RUNNER_TEMP/typst.tar.xz" -C "$RUNNER_TEMP"
          echo "UNDERTREE_TYPST=$RUNNER_TEMP/typst-x86_64-unknown-linux-musl/typst" >> "$GITHUB_ENV"
      - run: npm ci
      - run: dbus-run-session -- npm test
      - run: ./scripts/build-release.sh
      - run: ./scripts/test-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: undertree-linux
          path: release/undertree-*.tar.gz*
          if-no-files-found: error
