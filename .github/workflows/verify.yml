name: Verify Rust, Tauri, and Typst

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev

      - name: Install Rust 1.92
        run: |
          rustup toolchain install 1.92.0 --profile minimal --component rustfmt,clippy
          rustup override set 1.92.0

      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Check Rust and Tauri integration
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Install local UI dependency and build bundled frontend
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run build:web

      - name: Check frontend JavaScript
        run: |
          node --check web/citation-search.js
          node --check web/agent-annotations.js
          node --check web/typst-editing.js
          node --check web/review-selection.js
          node --check web/review-ui.js
          node --check web/ui-fit.js
          node --check web/app.js
          node --test web/citation-search.test.cjs
          node --test web/agent-annotations.test.cjs
          node --test web/typst-editing.test.cjs
          node --test web/review-selection.test.cjs

      - name: Lint
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test embedded Typst compiler
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib

      - name: Build release binary
        run: cargo build --locked --release --manifest-path src-tauri/Cargo.toml
