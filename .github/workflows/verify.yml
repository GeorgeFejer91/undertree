name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: ./scripts/build-release.sh
      - run: ./scripts/test-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: localtex-studio-linux
          path: release/localtex-studio-*.tar.gz*
          if-no-files-found: error
