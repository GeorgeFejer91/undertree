[package]
publish = false
name = "undertree-review"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "time", "signal", "io-util", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
tower-http = { version = "0.6", features = ["fs", "limit"] }
subtle = "2"
typst-syntax = "=0.15.1"
base64 = "0.22"
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"
futures-core = "0.3"
zip = { version = "=9.0.3", default-features = false }
