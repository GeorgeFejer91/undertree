[[permission]]
identifier = "allow-review-action"
description = "Named local manuscript and review operations; Rust validates project scope."
commands.allow = ["review_action"]

[[permission]]
identifier = "allow-word-count"
description = "Analyze bounded text supplied by the current local main window without accessing project files."
commands.allow = ["word_count_typst_text"]

[[permission]]
identifier = "allow-history-query"
description = "Read bounded saved History through the current local main-window owner without source recovery or mutation."
commands.allow = ["history_query"]

[[permission]]
identifier = "allow-editor-operation"
description = "Coordinate registered editor sessions in the local main window; never exposed through CLI or MCP."
commands.allow = ["editor_connect", "editor_operation"]

[[permission]]
identifier = "allow-control-operation"
description = "Local current-page coordination of explicitly enabled non-content App controls."
commands.allow = ["control_operation"]

[[permission]]
identifier = "allow-choose-project"
description = "Approve a local project using the native folder picker."
commands.allow = ["choose_project"]

[[permission]]
identifier = "allow-file-import"
description = "Stage native-picked files and commit only their owner-bound import selection."
commands.allow = ["choose_import_files", "import_operation"]

[[permission]]
identifier = "allow-project-export"
description = "Export an immutable saved project ZIP only to its owner-bound native-picked destination."
commands.allow = ["prepare_project_export", "choose_project_export_destination", "project_export_operation"]

[[permission]]
identifier = "allow-file-move"
description = "Coordinate bounded same-project source Move requests through the current local main-window owner."
commands.allow = ["prepare_file_move", "file_move_operation"]
